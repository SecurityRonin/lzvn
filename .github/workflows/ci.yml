name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Only the repo-specific jobs at the bottom of this file read these. A called
# workflow does not inherit caller-level `env:`; the reusable workflow declares
# its own copy of exactly the same three.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -Dwarnings

jobs:
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@85c7263e5e1a25a090f602419ac27f87aeb1d1e3
    with:
      # The old `test` job ran on ubuntu-latest only. `true` would newly gate on
      # macOS and Windows, which nothing here has ever been shown to pass.
      os-matrix: false
      # The old MSRV job ran `cargo test` on 1.85, not a bare build. The floor
      # needs no input: the single member declares rust-version "1.85", so the
      # workflow derives the same 1.85 the job was pinned to.
      msrv-check: test
      # `all-features` and `coverage-scope` stay at their defaults. This is a
      # one-package workspace whose only feature is `alloc`, and `alloc` is in
      # `default`, so `--workspace --all-features` compiles and measures exactly
      # the same lines the old bare `cargo llvm-cov` did.
      #
      # The repo's own deny.toml, not the shared fleet config. Local is strictly
      # STRICTER: `[bans] multiple-versions = "deny"` (shared: "warn") and
      # `[advisories] ignore = []` (shared: 21 RUSTSEC ignores). Adopting the
      # shared file would loosen this gate, which an adoption PR must not do.
      deny-config-repo: ""
      # cargo-deny-action defaults its `arguments` input to `--all-features`, so
      # the old job checked the full-feature dependency graph. Carry that across.
      deny-args: --all-features

  # ---------------------------------------------------------------------------
  # Repo-specific jobs, carried across from the pre-adoption ci.yml.
  # ---------------------------------------------------------------------------

  # The old clippy and test jobs each ran a second, `--no-default-features` leg:
  # the lean `no_std` build without the allocating convenience. The shared
  # workflow builds one feature set, so that leg lives here or nowhere.
  no-default-features:
    name: Clippy + Test (--no-default-features, no_std)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          cache-on-failure: true
      # The lean `no_std` build (no `alloc` convenience) must stay warning-clean.
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo test --no-default-features

  # The e2e half of the old `coverage` job. The shared workflow's coverage gate
  # measures the whole suite; this second, independent gate asserts the
  # integration suite ALONE reaches 100%. No input can express it, so it is
  # copied verbatim — only the surrounding job scaffolding is new, and that is
  # the same scaffolding the old coverage job used.
  coverage-e2e:
    name: Coverage (100% e2e, public API only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          cache-on-failure: true
      - run: cargo install cargo-llvm-cov --locked
      # The whole public API is exercised through the integration tests (tests/),
      # so the e2e suite alone must also reach 100% — no line is reachable only
      # via white-box unit tests.
      - name: Enforce 100% e2e (public-API) coverage
        run: |
          cargo llvm-cov --test decode --test errors --lcov --output-path e2e.info
          if grep -qE '^DA:[0-9]+,0$' e2e.info; then
            echo "::error::e2e leaves public-API lines uncovered:"; grep -nE '^(SF:|DA:[0-9]+,0$)' e2e.info
            exit 1
          fi
          echo "100% e2e coverage ✓"
